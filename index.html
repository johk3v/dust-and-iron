<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dust &amp; Iron</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header id="top-bar">
    <h1>🤠 Dust &amp; Iron</h1>
    <div id="gold-display">💰 <span id="gold-amount">0</span> Dollars</div>
  </header>

  <nav id="tabs">
    <button class="tab-btn active" data-tab="prospecting">⛏️ Prospecting</button>
    <button class="tab-btn" data-tab="lumberjacking">🪓 Lumberjacking</button>
    <button class="tab-btn" data-tab="blacksmithing">🔥 Blacksmithing</button>
    <button class="tab-btn" data-tab="gunsmithing">🔫 Gunsmithing</button>
    <button class="tab-btn" data-tab="combat">💀 Combat</button>
    <button class="tab-btn" data-tab="bank">🏦 Bank</button>
    <button class="tab-btn" data-tab="settings">⚙️ Settings</button>
  </nav>

  <div id="current-action-bar" class="hidden">
    <div id="current-action-label">Idle</div>
    <div class="progress-outer"><div id="current-action-progress" class="progress-inner"></div></div>
  </div>

  <main id="content">
    <section id="tab-prospecting" class="tab-pane active"></section>
    <section id="tab-lumberjacking" class="tab-pane"></section>
    <section id="tab-blacksmithing" class="tab-pane"></section>
    <section id="tab-gunsmithing" class="tab-pane"></section>
    <section id="tab-combat" class="tab-pane"></section>
    <section id="tab-bank" class="tab-pane"></section>
    <section id="tab-settings" class="tab-pane"></section>
  </main>

  <div id="toast-container"></div>
</div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
</body>
</html>
