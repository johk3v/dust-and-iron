<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dust &amp; Iron</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header id="top-bar">
    <h1>🤠 Dust &amp; Iron</h1>
    <div id="gold-display">$<span id="gold-amount">0</span></div>
  </header>

  <nav id="tabs">
    <button class="tab-btn active" data-tab="woodcutting">🪓 Woodcutting</button>
    <button class="tab-btn" data-tab="prospecting">⛏️ Prospecting</button>
    <button class="tab-btn" data-tab="farming">🌾 Farming</button>
    <button class="tab-btn" data-tab="fishing">🎣 Fishing</button>
    <button class="tab-btn" data-tab="exploration">🧭 Exploration</button>
    <button class="tab-btn" data-tab="craftsmanship">🔨 Craftsmanship</button>
    <button class="tab-btn" data-tab="settlement">🏘️ Settlement</button>
    <button class="tab-btn" data-tab="debauchery">🥃 Debauchery</button>
    <button class="tab-btn" data-tab="combat">💀 Combat</button>
    <button class="tab-btn" data-tab="bank">🏚️ Storage</button>
    <button class="tab-btn" data-tab="store">🏪 Store</button>
    <button class="tab-btn" data-tab="settings">⚙️ Settings</button>
  </nav>

  <main id="content">
    <section id="tab-woodcutting" class="tab-pane active"></section>
    <section id="tab-prospecting" class="tab-pane"></section>
    <section id="tab-farming" class="tab-pane"></section>
    <section id="tab-fishing" class="tab-pane"></section>
    <section id="tab-exploration" class="tab-pane"></section>
    <section id="tab-craftsmanship" class="tab-pane"></section>
    <section id="tab-settlement" class="tab-pane"></section>
    <section id="tab-debauchery" class="tab-pane"></section>
    <section id="tab-combat" class="tab-pane"></section>
    <section id="tab-bank" class="tab-pane"></section>
    <section id="tab-store" class="tab-pane"></section>
    <section id="tab-settings" class="tab-pane"></section>
  </main>

  <div id="toast-container"></div>
</div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
</body>
</html>
